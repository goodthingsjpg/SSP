    <!-- Tailwind（已預先編譯，離線也能用） -->
    <style>__TW_CSS__</style>

    <style>
        /* 王漢宗中楷體注音（GPL）：每個字的右側內建注音，字寬 1.5em */
        @font-face {
            font-family: 'CustomPhoneticFont';
            src: url('data:font/woff2;base64,__HW_FONT__') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }
        /* 同一套字型去掉注音的版本（只含常見破音字與注音符號），用來畫「校正後」的字 */
        @font-face {
            font-family: 'HWKaiPlain';
            src: url('data:font/woff2;base64,__PLAIN_FONT__') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        :root { --base-font-size: 16px; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* 預覽區 A4 */
        #a4-sizer { flex-shrink: 0; position: relative; }
        .a4-page {
            width: 210mm;
            height: 297mm;
            background-color: white;
            padding: 8mm;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: grid;
            gap: 5mm;
            transform-origin: top left;
            position: absolute;
            top: 0; left: 0;
        }

        .card-container {
            font-size: var(--base-font-size);
            break-inside: avoid;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .phonetic-on .card-container {
            font-family: 'CustomPhoneticFont', 'HWKaiPlain', 'Noto Sans TC', sans-serif;
        }

        .card-title   { font-size: 1.4em; line-height: 1.4; }
        .card-content { font-size: 1em;   line-height: 1.8; }
        .card-reply   { font-size: 0.9em; line-height: 1.7; }
        .phonetic-on .card-content { line-height: 1.65; }

        /* ===== 破音字校正：字 + 自畫注音欄，總寬 1.5em，與注音字型對齊 ===== */
        .zy { white-space: nowrap; }
        .zy-ch {
            font-family: 'HWKaiPlain', 'BiauKai', 'DFKai-SB', 'Kaiti TC', 'STKaiti', serif;
        }
        /* 每個注音符號都用絕對定位（em 單位），預覽、列印、匯出 PDF 都一致 */
        /* 注音欄畫成圖片（canvas），預覽、列印、匯出 PDF 位置完全一致 */
        .zy-img {
            display: inline-block;
            width: 0.5em;
            height: 1.074em;          /* 1100/1024 */
            vertical-align: -0.195em; /* 圖片下緣在基線下 200/1024 */
            max-width: none;
            pointer-events: none;
        }
        .zy-warn { outline: 1.5px dashed #f59e0b; outline-offset: 1px; border-radius: 2px; }

        /* ===== 匯出 PDF 時的截圖狀態 ===== */
        .exporting .zy-warn { outline: none !important; }
        .exporting.a4-page { transform: none !important; box-shadow: none !important; }

        /* ===== 列印 ===== */
        @page { size: A4 portrait; margin: 0; }
        @media print {
            html, body {
                width: 210mm;
                height: 297mm;
                overflow: hidden !important;
                display: block !important;
                background: white !important;
            }
            #ui-panel, #overflow-warning, .print-hidden { display: none !important; }
            #preview-panel, #preview-wrapper, #a4-sizer {
                display: block !important;
                position: static !important;
                width: auto !important;
                height: auto !important;
                padding: 0 !important;
                margin: 0 !important;
                overflow: visible !important;
                background: none !important;
            }
            .a4-page {
                position: static !important;
                width: 210mm !important;
                height: 296mm !important;   /* 留 1mm 避免印表機多跳一頁空白 */
                padding: 8mm !important;
                box-shadow: none !important;
                transform: none !important;
                page-break-after: avoid;
            }
            .zy-warn { outline: none !important; }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color: black !important;
            }
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>

        // 去掉注音後仍能用「同款楷體」畫出的字（其餘字會用系統楷體代替）
        const PLAIN_CHARS = new Set(Array.from('__PLAIN_CHARS__'));

        const DICT_KEYS = Object.keys(POLYPHONE_DICT).sort((a, b) => b.length - a.length);
        const DICT_MAX = DICT_KEYS.length ? DICT_KEYS[0].length : 0;
        const ZY_RE = /([㐀-鿿豈-﫿])[（(]\s*([˙]?[ㄅ-ㄩ]+[ˊˇˋ˙]?)\s*[）)]/g;

        const iconEmojis = {

        const defaultQuickInput = `標題：六福村校外教學通知

        const els = {

        // 各版型的字級上限（自動模式不會超過）
        const LAYOUT_MAX = { 1: 28, 2: 22, 4: 16, 6: 13 };
        const MIN_FONT = 7;

        // ================= 文字處理 =================
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, t => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[t]));
        }

        // 把文字切成 [{t:'文字'}, {ch:'長', zy:'ㄓㄤˇ', auto:true}] 這種片段
        function tokenize(str, phonetic, autofix, report) {
            const out = [];
            let last = 0, m;
            ZY_RE.lastIndex = 0;
            const pushText = (s) => {
                if (!s) return;
                if (!(phonetic && autofix)) { out.push({ t: s }); return; }
                let buf = '', i = 0;
                while (i < s.length) {
                    let hit = null;
                    for (let len = Math.min(DICT_MAX, s.length - i); len >= 2; len--) {
                        const w = s.substr(i, len);
                        if (POLYPHONE_DICT[w]) { hit = w; break; }
                    }
                    if (!hit) { buf += s[i]; i++; continue; }
                    if (buf) { out.push({ t: buf }); buf = ''; }
                    const readings = POLYPHONE_DICT[hit].split('|');
                    Array.from(hit).forEach((ch, k) => {
                        if (readings[k]) out.push({ ch, zy: readings[k], auto: true });
                        else out.push({ t: ch });
                    });
                    report[hit] = (report[hit] || 0) + 1;
                    i += hit.length;
                }
                if (buf) out.push({ t: buf });
            };
            while ((m = ZY_RE.exec(str)) !== null) {
                pushText(str.slice(last, m.index));
                out.push({ ch: m[1], zy: m[2] });
                last = ZY_RE.lastIndex;
            }
            pushText(str.slice(last));
            return out;
        }

        // 注音欄的幾何數值：直接量測王漢宗字型內建注音的位置（單位：1/1024 字寬，y 為基線以上）
        const ZY_GEO = {
            symX: 1172, toneX: 1405,
            scale: { 1: 0.36, 2: 0.34, 3: 0.31 },          // 注音符號縮放比例（依符號數）
            center: { 1: 327, 2: 316, 3: 318 },             // 整欄中心高度
            pitch: { 1: 0, 2: 314, 3: 283 },                // 符號間距
            toneScale: 0.6, lightScale: 0.68,
            symMid: 0.303,        // 注音符號字形中心在基線上方多少（em）
            toneMid: 0.745,       // 聲調符號字形中心在基線上方多少（em）
            imgTop: 900, imgBottom: -200, imgLeft: 1024, imgW: 512   // 圖片涵蓋範圍
        };
        const ZY_RES = 240;       // 每個字寬畫幾個像素（愈大愈清楚）
        const zyCache = new Map();

        function drawZhuyin(zy) {
            if (zyCache.has(zy)) return zyCache.get(zy);
            const G = ZY_GEO, R = ZY_RES;
            let light = false, body = zy, tone = '';
            if (body[0] === '˙') { light = true; body = body.slice(1); }
            if (/[ˊˇˋ]$/.test(body)) { tone = body.slice(-1); body = body.slice(0, -1); }
            const syms = Array.from(body);
            const n = Math.min(Math.max(syms.length, 1), 3);
            const s = G.scale[n], pitch = G.pitch[n], c = G.center[n];
            const ys = syms.map((_, i) => c + ((n - 1) / 2 - i) * pitch);

            const cv = document.createElement('canvas');
            cv.width = Math.round(G.imgW / 1024 * R);
            cv.height = Math.round((G.imgTop - G.imgBottom) / 1024 * R);
            const ctx = cv.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'alphabetic';
            const put = (txt, cx, cy, scale, mid) => {
                const px = scale * R;
                ctx.font = `${px}px HWKaiPlain`;
                const x = (cx - G.imgLeft) / 1024 * R;
                const y = (G.imgTop - cy) / 1024 * R + mid * px;   // 由字形中心換算成基線
                ctx.fillText(txt, x, y);
            };
            syms.forEach((sym, i) => put(sym, G.symX, ys[i], s, G.symMid));
            if (tone) put(tone, G.toneX, n === 1 ? ys[0] - 20 : (ys[n - 1] + ys[n - 2]) / 2, G.toneScale, G.toneMid);
            if (light) put('˙', G.symX, ys[0] + 228, G.lightScale, G.toneMid);
            const url = cv.toDataURL('image/png');
            zyCache.set(zy, url);
            return url;
        }

        function fillZhuyinImages() {
            els.canvas.querySelectorAll('img.zy-img').forEach(img => {
                img.src = drawZhuyin(img.dataset.zy);
            });
        }

        function zhuyinHTML(ch, zy) {
            const warn = PLAIN_CHARS.has(ch) ? '' : ' zy-warn';
            const title = warn ? ' title="此字不在內建楷體字表中，以系統楷體顯示"' : '';
            return `<span class="zy${warn}"${title}><span class="zy-ch">${escapeHTML(ch)}</span><img class="zy-img" data-zy="${escapeHTML(zy)}" alt=""></span>`;
        }

        function formatText(str, ctx) {
            const tokens = tokenize(str, ctx.phonetic, ctx.autofix, ctx.report);
            return tokens.map(tok => {
                if (tok.t !== undefined) return escapeHTML(tok.t).replace(/\[\]/g, '☐');
                if (!ctx.phonetic) return escapeHTML(tok.ch);   // 非注音模式：只留字，拿掉括號注音
                return zhuyinHTML(tok.ch, tok.zy);
            }).join('');
        }

        // ================= 一鍵貼上 =================
        function parseQuickInput(text) {
            if (!text.trim()) return;
            const tTitle = text.match(/標題[：:](.*)/);
            const tContent = text.match(/內容[：:]([\s\S]*?)(?=回條[：:]|署名[：:]|$)/);
            const tReply = text.match(/回條[：:]([\s\S]*?)(?=署名[：:]|$)/);
            const tSign = text.match(/署名[：:](.*)/);
            if (tTitle) els.title.value = tTitle[1].trim();
            if (tContent) els.content.value = tContent[1].trim();
            if (tReply) els.reply.value = tReply[1].trim();
            if (tSign) els.sign.value = tSign[1].trim();
            renderPreview();
        }

        // ================= 預覽縮放 =================
        function adjustScale() {
            const a4W = els.canvas.offsetWidth, a4H = els.canvas.offsetHeight;
            const availW = els.wrapper.clientWidth - 48;
            const availH = els.wrapper.clientHeight - 48;
            const scale = Math.max(0.2, Math.min(availW / a4W, availH / a4H, 0.95));
            els.canvas.style.transform = `scale(${scale})`;
            els.sizer.style.width = (a4W * scale) + 'px';
            els.sizer.style.height = (a4H * scale) + 'px';
        }

        // ================= 版面 =================
        function getLayout() {
            for (const r of els.radiosLayout) if (r.checked) return parseInt(r.value);
            return 2;
        }

        function isOverflowing() {
            const box = els.canvas.querySelector('.inner-box');
            if (!box) return false;
            return box.scrollHeight > box.clientHeight + 1 || box.scrollWidth > box.clientWidth + 1;
        }

        function setFontSize(px) {
            els.canvas.style.setProperty('--base-font-size', px + 'px');
        }

        // 自動模式：二分搜尋「剛好塞得下」的最大字級
        function fitFontSize(layout) {
            const maxPx = LAYOUT_MAX[layout];
            if (!els.chkAutofit.checked) {
                const px = parseFloat(els.sliderFontSize.value);
                setFontSize(px);
                return { px, overflow: isOverflowing() };
            }
            setFontSize(maxPx);
            if (!isOverflowing()) return { px: maxPx, overflow: false };
            let lo = MIN_FONT, hi = maxPx;
            setFontSize(lo);
            if (isOverflowing()) return { px: lo, overflow: true };
            for (let i = 0; i < 10; i++) {
                const mid = (lo + hi) / 2;
                setFontSize(mid);
                if (isOverflowing()) hi = mid; else lo = mid;
            }
            const px = Math.floor(lo * 4) / 4;
            setFontSize(px);
            return { px, overflow: false };
        }

        let renderToken = 0;
        async function renderPreview() {
            const myToken = ++renderToken;
            const layout = getLayout();
            const phonetic = els.chkPhonetic.checked;
            const ctx = { phonetic, autofix: els.chkAutofix.checked, report: {} };

            els.phoneticOptions.classList.toggle('hidden', !phonetic);

            const titleStr = formatText(els.title.value, ctx);
            const contentStr = formatText(els.content.value, ctx);
            const rawReply = els.reply.value.trim();
            const hasReply = rawReply && rawReply !== '無';
            const replyStr = hasReply ? formatText(rawReply, ctx) : '';
            const signStr = formatText(els.sign.value, ctx);

            const gridClass = {
                1: 'grid-cols-1 grid-rows-1',
                2: 'grid-cols-1 grid-rows-2',
                4: 'grid-cols-2 grid-rows-2',
                6: 'grid-cols-2 grid-rows-3'
            }[layout];
            els.canvas.className = `a4-page ${gridClass} ${phonetic ? 'phonetic-on' : ''}`;

            const selectedEmoji = iconEmojis[els.selectIcon.value] || '';
            const iconHtml = selectedEmoji ? `<span class="text-[1.2em]" style="font-family:'Noto Sans TC',sans-serif">${selectedEmoji}</span>` : '';

            const replyHtml = hasReply ? `
                <div class="mt-auto pt-2 shrink-0">
                    <div class="border-t-[1.5px] border-dashed border-gray-500 mb-2 mt-1"></div>
                    <div class="card-reply whitespace-pre-wrap text-black break-words">${replyStr}</div>
                </div>` : '<div class="mt-auto"></div>';

            const cardHtml = `
                <div class="card-container w-full h-full min-h-0 border-[2.5px] border-black rounded-2xl p-[3px] box-border relative overflow-hidden bg-white">
                    <div class="inner-box w-full h-full border-[1.5px] border-dashed border-gray-600 rounded-xl p-[1em] flex flex-col box-border overflow-hidden">
                        <div class="card-title font-black text-center mb-[0.5em] flex items-center justify-center gap-2 border-b-2 border-black pb-[0.3em] shrink-0">
                            ${iconHtml}<span>${titleStr}</span>
                        </div>
                        <div class="card-content whitespace-pre-wrap text-black flex-1 break-words">${contentStr}</div>
                        ${els.sign.value.trim() ? `<div class="card-sign font-bold text-right mt-[0.6em] shrink-0 text-black">${signStr}</div>` : ''}
                        ${replyHtml}
                    </div>
                </div>`;
            els.canvas.innerHTML = cardHtml.repeat(layout);

            // 破音字校正報告
            const entries = Object.entries(ctx.report);
            if (phonetic && entries.length) {
                els.zyReport.innerHTML = '已自動校正：' + entries.map(([w, n]) => {
                    const r = POLYPHONE_DICT[w].split('|');
                    const detail = Array.from(w).map((c, i) => r[i] ? `${c}${r[i]}` : '').filter(Boolean).join('、');
                    return `<b>${w}</b>（${detail}）${n > 1 ? '×' + n : ''}`;
                }).join('　');
                els.zyReport.classList.remove('hidden');
            } else {
                els.zyReport.classList.add('hidden');
            }

            // 等字型載入完再量尺寸
            if (phonetic) {
                const sample = (els.title.value + els.content.value + els.reply.value + els.sign.value).slice(0, 200) || '注';
                const needLoad = !document.fonts.check(`16px CustomPhoneticFont`, sample);
                if (needLoad) els.fontLoading.classList.remove('hidden');
                try {
                    await Promise.all([
                        document.fonts.load(`16px CustomPhoneticFont`, sample),
                        document.fonts.load(`16px HWKaiPlain`, '長ㄓㄤˇ')
                    ]);
                } catch (e) {}
                els.fontLoading.classList.add('hidden');
                if (myToken !== renderToken) return;
                fillZhuyinImages();
            }

            const { px, overflow } = fitFontSize(layout);
            els.lblFontSize.textContent = px + 'px';
            els.sliderFontSize.disabled = els.chkAutofit.checked;
            if (els.chkAutofit.checked) els.sliderFontSize.value = px;
            els.hintFontSize.textContent = els.chkAutofit.checked ? '自動模式下由系統計算' : '手動調整';

            if (overflow) {
                els.warningText.textContent = els.chkAutofit.checked
                    ? '字已縮到最小仍塞不下，請刪減內容或改用較少張的版型。'
                    : '內容過長，已超出邊界。建議縮小字級或開啟自動調整。';
                els.warning.classList.remove('hidden');
            } else {
                els.warning.classList.add('hidden');
            }
            adjustScale();
        }

        // ================= 下載 PDF =================
        async function downloadPDF() {
            const btn = document.getElementById('btn-pdf');
            const txt = document.getElementById('btn-pdf-text');
            btn.disabled = true;
            txt.textContent = '產生中…';
            try {
                await renderPreview();
                await document.fonts.ready;
                const el = els.canvas;
                const jpeg = await modernScreenshot.domToJpeg(el, {
                    scale: 3,                 // 約 290 dpi，印出來文字清楚
                    quality: 0.92,
                    backgroundColor: '#ffffff',
                    width: el.offsetWidth,
                    height: el.offsetHeight,
                    style: { transform: 'none', boxShadow: 'none', position: 'static' },
                    onCloneNode: (clone) => clone.classList.add('exporting')
                });
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
                pdf.addImage(jpeg, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
                const name = (els.title.value.trim() || '通知單').replace(/[\\/:*?"<>|]/g, '_');
                pdf.save(`${name}.pdf`);
            } catch (err) {
                console.error(err);
                alert('PDF 產生失敗，請改用 Chrome 開啟此檔案再試一次。');
            } finally {
                btn.disabled = false;
                txt.textContent = '下載 PDF';
            }
        }

        // ================= 事件 =================
        els.quickInput.addEventListener('input', e => parseQuickInput(e.target.value));
        [els.title, els.content, els.reply, els.sign].forEach(i => i.addEventListener('input', renderPreview));
        Array.from(els.radiosLayout).forEach(r => r.addEventListener('change', renderPreview));
        [els.selectIcon, els.chkPhonetic, els.chkAutofix, els.chkAutofit].forEach(e => e.addEventListener('change', renderPreview));
        els.sliderFontSize.addEventListener('input', renderPreview);
        window.addEventListener('resize', adjustScale);
        document.fonts.addEventListener('loadingdone', () => renderPreview());

        function init() {
            els.quickInput.value = defaultQuickInput;
            parseQuickInput(defaultQuickInput);
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
